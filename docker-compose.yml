version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: franquicias-postgres
    environment:
      POSTGRES_DB: franquicias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - franquicias-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franquicias-app
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/franquicias
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - franquicias-network

volumes:
  postgres_data:

networks:
  franquicias-network:
    driver: bridge
